<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2=".6" y2="1">
      <stop stop-color="#090a0c"/>
      <stop offset="1" stop-color="#111317"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#00d4aa" stop-opacity=".6"/>
      <stop offset="1" stop-color="#00d4aa" stop-opacity=".15"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- card -->
  <rect x="80" y="70" width="1040" height="490" rx="20" fill="#111317" fill-opacity=".9" stroke="rgba(255,255,255,.08)" stroke-width="1"/>

  <!-- brand -->
  <text x="120" y="130" fill="#f5f5f2" font-family="Inter,-apple-system,sans-serif" font-size="24" font-weight="700" letter-spacing="2">TRYTO<tspan fill="#00d4aa">ATTACK</tspan>ME</text>
  <text x="120" y="156" fill="#8c919b" font-family="Inter,-apple-system,sans-serif" font-size="12" letter-spacing="1">defensive traffic observability</text>

  <!-- shield circle -->
  <circle cx="600" cy="340" r="100" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="1"/>
  <circle cx="600" cy="340" r="65" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="1"/>

  <!-- ring segments -->
  <g transform="translate(600,340)">
    <path d="M0,-80 A80,80 0 0,1 69.3,-40" fill="none" stroke="url(#ring)" stroke-width="30" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M69.3,40 A80,80 0 0,1 0,80" fill="none" stroke="url(#ring)" stroke-width="30" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M-69.3,40 A80,80 0 0,1 -69.3,-40" fill="none" stroke="url(#ring)" stroke-width="30" stroke-linecap="round" filter="url(#glow)"/>
  </g>

  <!-- core glow -->
  <circle cx="600" cy="340" r="30" fill="#00d4aa" fill-opacity=".3" filter="url(#glow)"/>
  <circle cx="600" cy="340" r="12" fill="#00d4aa" fill-opacity=".7"/>

  <!-- percentage -->
  <text x="600" y="500" fill="#f5f5f2" font-family="SF Mono,ui-monospace,monospace" font-size="14" text-anchor="middle" letter-spacing="2">0% · NOMINAL TRAFFIC</text>

  <!-- KPIs -->
  <g font-family="SF Mono,ui-monospace,monospace" fill="#f5f5f2">
    <text x="140" y="440" font-size="10" fill="#8c919b" letter-spacing="1">REQUESTS</text>
    <text x="140" y="466" font-size="24" font-weight="600">12,481</text>
    <text x="340" y="440" font-size="10" fill="#8c919b" letter-spacing="1">CURRENT RPS</text>
    <text x="340" y="466" font-size="24" font-weight="600">184</text>
    <text x="540" y="440" font-size="10" fill="#8c919b" letter-spacing="1">BLOCKED</text>
    <text x="540" y="466" font-size="24" font-weight="600" fill="#e84855">2,913</text>
    <text x="740" y="440" font-size="10" fill="#8c919b" letter-spacing="1">LATENCY P95</text>
    <text x="740" y="466" font-size="24" font-weight="600">12ms</text>
  </g>

  <!-- footer -->
  <text x="600" y="606" fill="#5f646d" font-family="Inter,-apple-system,sans-serif" font-size="11" text-anchor="middle" letter-spacing="1">trytoattackme.vercel.app</text>
</svg>
